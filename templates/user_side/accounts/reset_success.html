{% extends 'base.html' %}

{% block title %}Decora | Success{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-80px)] p-4">
    <div class="w-full max-w-[420px] bg-[#1a1a1a] border border-white/5 p-12 rounded-2xl shadow-2xl relative z-10 text-center">
        
        <div class="mb-8 flex justify-center">
            <div class="w-20 h-20 rounded-full border-2 border-[#D4AF37] flex items-center justify-center bg-[#D4AF37]/5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-[#D4AF37]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
        </div>

        <h1 class="premium-font text-3xl text-[#D4AF37] mb-4">Security Updated</h1>
        <p class="text-gray-400 text-[11px] uppercase tracking-[0.2em] leading-relaxed mb-10">
            Your password has been reset successfully. <br> Your account is now secure.
        </p>

        <div class="space-y-4">
            <a href="{% url 'user_login' %}" 
               class="block w-full bg-gradient-to-r from-[#D4AF37] via-[#F1D27B] to-[#B8860B] text-black font-bold py-4 rounded-lg hover:opacity-90 transition-opacity uppercase text-xs tracking-[0.2em] shadow-lg shadow-[#D4AF37]/10">
                Continue to Login
            </a>
            
            
        </div>
    </div>
</div>
{% endblock %}
