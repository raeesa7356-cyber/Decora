<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decora Admin | Luxury Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0A0A0A] flex font-sans text-gray-300">

    <aside class="w-64 h-screen bg-[#111111] border-r border-white/5 flex flex-col sticky top-0">
        <div class="p-8">
            <h1 class="text-xl font-bold text-white tracking-tighter uppercase">Decora <span class="text-[#D4AF37]">Admin</span></h1>
            <p class="text-[#D4AF37]/50 text-[9px] uppercase tracking-[0.2em] mt-1 font-semibold">The Curated Atelier</p>
        </div>


<nav class="flex-1 px-4 overflow-y-auto space-y-1">

    {% with current_url=request.resolver_match.view_name %}

        {% for name, icon, url_name in sidebar_items %}

        <a href="{% if url_name and url_name != '#' %}{% url url_name %}{% else %}#{% endif %}"

           class="flex items-center px-4 py-3 rounded-xl transition-all duration-300

           {% if url_name and current_url == url_name %}
                bg-white/5 text-[#D4AF37] border border-[#D4AF37]/20
           {% else %}
                text-gray-500 hover:text-[#D4AF37] hover:bg-white/5
           {% endif %}">

            <i class="fa-solid fa-{{ icon }} mr-3 text-xs
               {% if url_name and current_url == url_name %}
                    text-[#D4AF37]
               {% endif %}">
            </i>

            {{ name }}

        </a>

        {% endfor %}

    {% endwith %}

</nav>
        <div class="p-6 border-t border-white/5 space-y-4">
            <a href="#" class="flex items-center text-gray-500 hover:text-white transition text-sm">
                <i class="fa-solid fa-gear mr-3"></i> Settings
            </a>
            <a href="{% url 'logout-page' %}" class="flex items-center text-gray-500 hover:text-red-400 transition text-sm">
                <i class="fa-solid fa-arrow-right-from-bracket mr-3"></i> Logout
            </a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-20 bg-[#0A0A0A] border-b border-white/5 flex items-center justify-end px-10 shrink-0">
    
    <!-- Right Side: Profile & Notifications -->
    <div class="flex items-center space-x-8">
        
        <!-- Notification Bell -->
        <button class="relative text-gray-500 hover:text-[#D4AF37] transition">
            <i class="fa-regular fa-bell text-lg"></i>
            <!-- Small Notification Dot -->
            <span class="absolute top-0 right-0 w-2 h-2 bg-[#D4AF37] rounded-full border-2 border-[#0A0A0A]"></span>
        </button>

        <!-- Vertical Divider -->
        <div class="h-8 w-px bg-white/5"></div>

        <!-- Admin Profile -->
        <div class="flex items-center space-x-3">
            <div class="text-right">
                <p class="text-xs font-bold text-white leading-none">Raheesa</p>
                <p class="text-[10px] text-[#D4AF37] font-medium uppercase tracking-tighter mt-1">Super Admin</p>
            </div>
            <div class="w-10 h-10 rounded-full border-2 border-[#D4AF37]/30 p-0.5 overflow-hidden">
                <img src="https://ui-avatars.com/api/?name=Raheesa&background=D4AF37&color=000" class="w-full h-full rounded-full object-cover" alt="Avatar">
            </div>
        </div>
        
    </div>
</header>

        <main class="flex-1 overflow-y-auto p-10">
            {% block content %}{% endblock %}
        </main>
    </div>
<div id="toast-container"
     class="fixed top-6 right-6 z-[99999] space-y-3">
</div>

{% if messages %}
<script>
document.addEventListener('DOMContentLoaded', () => {

    {% for message in messages %}
        showToast(
            "{{ message|escapejs }}",
            "{{ message.tags }}"
        );
    {% endfor %}

});
</script>
{% endif %}

<script>
function showToast(message, type='success') {

    const container =
        document.getElementById('toast-container');

    const toast = document.createElement('div');

    let colorClass = '';

    if (type === 'success') {
        colorClass =
            'border-green-500/30 bg-green-500/10 text-green-400';
    }
    else if (type === 'error') {
        colorClass =
            'border-red-500/30 bg-red-500/10 text-red-400';
    }
    else if (type === 'warning') {
        colorClass =
            'border-yellow-500/30 bg-yellow-500/10 text-yellow-400';
    }
    else {
        colorClass =
            'border-white/10 bg-white/5 text-white';
    }

    toast.className = `
        min-w-[320px]
        max-w-[420px]
        px-5 py-4
        rounded-2xl
        backdrop-blur-xl
        border
        shadow-2xl
        text-sm
        font-medium
        translate-x-[120%]
        opacity-0
        transition-all
        duration-500
        ${colorClass}
    `;

    toast.innerHTML = `
        <div class="flex items-center justify-between gap-4">
            <span>${message}</span>

            <button class="opacity-60 hover:opacity-100">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    `;

    container.appendChild(toast);

    setTimeout(() => {
        toast.classList.remove(
            'translate-x-[120%]',
            'opacity-0'
        );
    }, 50);

    const removeToast = () => {

        toast.classList.add(
            'translate-x-[120%]',
            'opacity-0'
        );

        setTimeout(() => {
            toast.remove();
        }, 500);
    };

    toast.querySelector('button')
        .addEventListener('click', removeToast);

    setTimeout(removeToast, 10000);
}
</script>
</body>
</html>
