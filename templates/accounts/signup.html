{% extends 'base.html' %}

{% block title %}Decora | Create Your Account{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-80px)] p-4">
    <div class="w-full max-w-[450px] bg-[#1a1a1a] border border-white/5 p-10 rounded-2xl shadow-2xl relative z-10 my-10">
        
        <div class="text-center mb-8">
            <h1 class="premium-font text-4xl text-[#D4AF37] mb-2">Decora</h1>
            <p class="text-gray-400 text-[11px] uppercase tracking-[0.2em]">Join our community of premium decor</p>
        </div>

        <form action="{% url 'signup' %}" method="POST" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Full Name</label>
                <input type="text" name="fullname" required
                    class="w-full bg-[#252525] border border-white/10 rounded-lg px-4 py-3 text-white outline-none transition-all focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37]/30">
            </div>

            <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Email Address</label>
                <input type="email" name="email" required
                    class="w-full bg-[#252525] border border-white/10 rounded-lg px-4 py-3 text-white outline-none transition-all focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37]/30">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Password</label>
                    <input type="password" name="password" required
                        class="w-full bg-[#252525] border border-white/10 rounded-lg px-4 py-3 text-white outline-none transition-all focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37]/30">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Confirm</label>
                    <input type="password" name="confirm_password" required
                        class="w-full bg-[#252525] border border-white/10 rounded-lg px-4 py-3 text-white outline-none transition-all focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37]/30">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-gradient-to-r from-[#D4AF37] via-[#F1D27B] to-[#B8860B] text-black font-bold py-3.5 rounded-lg mt-4 hover:opacity-90 transition-opacity uppercase text-xs tracking-widest shadow-lg shadow-[#D4AF37]/10">
                Create Account
            </button>
        </form>

        <div class="flex items-center my-8">
            <div class="flex-grow border-t border-white/5"></div>
            <span class="mx-4 text-gray-600 text-[10px] uppercase tracking-widest">Or</span>
            <div class="flex-grow border-t border-white/5"></div>
        </div>

        
{% load socialaccount %}

<a href="{% provider_login_url 'google' %}" class="block w-full">
    <button type="button" class="w-full bg-transparent border border-white/10 text-white py-3 rounded-lg flex items-center justify-center space-x-3 hover:bg-white/5 transition-colors group">
        <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5 opacity-80 group-hover:opacity-100 transition-opacity" alt="Google">
        <span class="text-xs uppercase tracking-widest">Continue with Google</span>
    </button>
</a>
        <p class="text-center text-gray-500 text-xs mt-10 tracking-wide">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-[#D4AF37] hover:text-[#F1D27B] transition-colors font-medium">Login here</a>
        </p>
    </div>
</div>

{% endblock %}
