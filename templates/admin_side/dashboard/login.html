<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decora | Admin Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
        }

        .premium-font {
            font-family: 'Playfair+Display', serif;
        }

        /* Custom Glow Effect for the Login Card */
        .login-card {
            background: linear-gradient(145deg, #161616, #0f0f0f);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Input field styling */
        .custom-input {
            background-color: #0f0f0f !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">

    <div class="max-w-md w-full login-card p-10 rounded-[2rem] border border-white/5 relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent opacity-50"></div>

        <div class="text-center mb-10">
            <h2 class="premium-font text-4xl text-white mb-2 uppercase tracking-[0.2em]">
                Decora <span class="text-[#D4AF37]">Admin</span>
            </h2>
            <p class="text-gray-500 text-[9px] tracking-[0.3em] uppercase font-semibold">
                Authorization Required
            </p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label class="block text-[10px] uppercase tracking-[0.2em] text-gray-500 ml-4 font-bold">Username</label>
                <input type="text" name="username" required autocomplete="off"
                    class="w-full custom-input rounded-full px-6 py-4 text-white focus:outline-none text-sm">
            </div>

          <div class="space-y-2">
                <label class="block text-[10px] uppercase tracking-[0.2em] text-gray-500 ml-4 font-bold">Password</label>
                <div class="relative">
                    <input type="password" name="password" id="password-field" required
                        class="w-full custom-input rounded-full px-6 py-4 pr-14 text-white focus:outline-none text-sm">
                    <button type="button" id="toggle-password"
                            class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[#D4AF37] transition-colors">
                        <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
            </div>
            {% if messages %}
                <div class="pt-2">
                    {% for message in messages %}
                        <div class="bg-red-500/5 border border-red-500/20 py-3 rounded-xl">
                            <p class="text-red-500 text-[10px] uppercase text-center font-bold tracking-widest">
                                {{ message }}
                            </p>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit" 
                class="w-full bg-[#D4AF37] hover:bg-white text-black py-5 rounded-full font-black uppercase text-[11px] tracking-[0.25em] transition-all duration-500 transform hover:shadow-[0_0_30px_rgba(212,175,55,0.2)] mt-4">
                Enter Dashboard
            </button>
        </form>

        
    </div>
<script>
        const toggleBtn = document.getElementById('toggle-password');
        const passwordField = document.getElementById('password-field');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        toggleBtn.addEventListener('click', () => {
            const isHidden = passwordField.type === 'password';
            passwordField.type = isHidden ? 'text' : 'password';
            eyeOpen.classList.toggle('hidden', isHidden);
            eyeClosed.classList.toggle('hidden', !isHidden);
        });
    </script>
</body>
</html>
