{% extends 'admin_base.html' %}
{% block content %}
<div class="p-8 flex justify-center items-center min-h-[80vh]">
    <div class="w-full max-w-2xl">
        <form method="POST" class="bg-[#111111] p-12 rounded-[3rem] border border-white/5 shadow-2xl relative overflow-hidden">
            {% csrf_token %}
            
            <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-[#E3C565]/40 to-transparent"></div>

            <header class="text-center mb-10">
                <h2 class="premium-font text-white text-3xl mb-2">Edit Room Type</h2>
                <p class="text-gray-500 text-[10px] uppercase tracking-[0.3em]">Modify the spatial scope of your collection</p>
            </header>
            
            <div class="space-y-8">
                <div>
                    <label class="text-[10px] text-gray-500 uppercase tracking-[0.2em] block mb-3 font-bold">Room Name</label>
                    <input type="text" name="name" value="{{ room.name }}" required
                        class="w-full bg-white/[0.03] border border-white/10 rounded-2xl p-4 text-white focus:border-[#E3C565] outline-none transition">
                </div>

                <div>
                    <label class="text-[10px] text-gray-500 uppercase tracking-[0.2em] block mb-4 font-bold">Visibility Status</label>
                    <div class="flex items-center space-x-10">
                        <label class="flex items-center space-x-3 cursor-pointer group">
                            <input type="radio" name="status" value="active" {% if room.is_active %}checked{% endif %} class="w-4 h-4 accent-[#E3C565]">
                            <span class="text-sm text-gray-400 group-hover:text-white transition">Active (Live)</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer group">
                            <input type="radio" name="status" value="inactive" {% if not room.is_active %}checked{% endif %} class="w-4 h-4 accent-[#E3C565]">
                            <span class="text-sm text-gray-400 group-hover:text-white transition">Inactive (Hidden)</span>
                        </label>
                    </div>
                    <p class="mt-4 text-[9px] text-gray-600 italic">
                        * Inactive rooms will be moved to the "Hidden" section on the management page.
                    </p>
                </div>

                <div class="flex pt-6 space-x-4">
                    <button type="submit" class="flex-1 bg-[#E3C565] text-black font-bold py-5 rounded-2xl uppercase text-[10px] tracking-[0.2em] hover:bg-white transition shadow-lg shadow-[#E3C565]/10">
                        Update Room
                    </button>
                    <a href="{% url 'catalog:category-list' %}" class="flex-1 bg-white/5 text-gray-500 font-bold py-5 rounded-2xl text-center uppercase text-[10px] tracking-[0.2em] hover:bg-white/10 transition">
                        Cancel
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
