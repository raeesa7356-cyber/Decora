{% extends 'admin_base.html' %}

{% block content %}

<h2 class="text-white text-3xl font-bold mb-8">
<h2 class="text-white text-3xl font-bold mb-8">

    {% if edit_mode %}
        Edit Style
    {% else %}
        Add Style
    {% endif %}

</h2></h2>

<form method="POST"
      class="bg-[#111111] p-6 rounded-3xl border border-white/10 max-w-xl">

    {% csrf_token %}

<div class="space-y-5">

    <div>
        <label class="block text-gray-400 mb-2">
            Style Name
        </label>
        {{ form.name }}
    </div>

    <div class="flex items-center gap-3">

        {{ form.is_active }}

        <label class="text-white">
            Active Style
        </label>

    </div>

</div>
    <button type="submit"
            class="mt-6 bg-[#D4AF37] text-black px-6 py-3 rounded-xl font-semibold">
        Save Style
    </button>

</form>

{% endblock %}
