{% extends 'base.html' %}

{% block title %}Decora | Verify OTP{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-80px)] p-4">
    <div class="w-full max-w-[420px] bg-[#1a1a1a] border border-white/5 p-10 rounded-2xl shadow-2xl relative z-10 text-center">
        
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#D4AF37]/10 mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[#D4AF37]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>

        <h2 class="premium-font text-3xl text-[#D4AF37] mb-3">Verification</h2>
        <p class="text-gray-400 text-sm mb-8 leading-relaxed">
    We've sent a 6-digit code to <br>
    <span class="text-white font-medium">{{ request.session.reset_email }}</span>
</p>
        <form action="{% url 'verify_reset_otp' %}" method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="flex justify-center gap-3">
                <input type="text" name="otp_code" maxlength="6" required
                    placeholder="······"
                    class="w-full tracking-[1em] text-center text-2xl bg-[#252525] border border-white/10 rounded-lg py-4 text-[#D4AF37] outline-none focus:border-[#D4AF37] transition-all font-mono uppercase">
            </div>

            <button type="submit" 
                class="w-full bg-gradient-to-r from-[#D4AF37] via-[#F1D27B] to-[#B8860B] text-black font-bold py-4 rounded-lg hover:opacity-90 transition-opacity uppercase text-xs tracking-widest">
                Verify & Join
            </button>
        </form>

        <div class="mt-10">
    <div id="timer-container" class="text-gray-600 text-[10px] uppercase tracking-widest mb-2">
        Didn't receive code? <br>
        <span class="text-[#D4AF37]/50 normal-case mt-2 block">
            Resend available in <span id="timer-seconds" class="font-mono text-white">60</span>s
        </span>
    </div>
    
    <a href="{% url 'resend_otp' %}" id="resend-link" 
       class="hidden text-[#D4AF37] text-xs hover:text-white font-bold uppercase tracking-widest transition-colors">
       Resend New OTP
    </a>
</div>
        
        <a href="{% url 'signup' %}" class="block mt-6 text-gray-500 text-[10px] uppercase tracking-tighter hover:text-white transition-colors">
            Use a different email address
        </a>
    </div>
</div>

<script>
    let timeLeft = 60;
    const timerSeconds = document.getElementById('timer-seconds');
    const timerContainer = document.getElementById('timer-container');
    const resendLink = document.getElementById('resend-link');

    const countdown = setInterval(() => {
        timeLeft--;
        timerSeconds.textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerContainer.classList.add('hidden'); // Hide the timer message
            resendLink.classList.remove('hidden');  // Show the resend button
        }
    }, 1000);
</script>
{% endblock %}
