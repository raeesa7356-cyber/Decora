<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decora | Manual Security</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap');
        .premium-font { font-family: 'Playfair+Display', serif; }
        .custom-input {
            background: #0f0f0f;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 15px rgba(212,175,55,0.1);
            outline: none;
        }
    </style>
</head>
<body class="bg-[#0A0A0A] min-h-screen flex items-center justify-center px-6">

    <div class="max-w-md w-full bg-[#111] p-10 rounded-[2.5rem] border border-white/5 shadow-2xl">
        
        <div class="text-center mb-10">
            <h2 class="premium-font text-3xl text-white uppercase tracking-widest">Security</h2>
            <p class="text-gray-500 text-[10px] uppercase tracking-widest mt-2">Update your Credentials</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

<div class="space-y-2">
    <label class="block text-[10px] uppercase tracking-widest text-gray-500 ml-4">Current Password</label>
    <div class="relative">
        <input type="password" name="old_password" id="old-password" required
            class="w-full custom-input rounded-full px-6 py-4 pr-14 text-white text-sm">
        <button type="button" onclick="togglePassword('old-password', this)"
            class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[#D4AF37] transition">
            <i class="fa-regular fa-eye text-sm"></i>
        </button>
    </div>
</div>

<div class="space-y-2">
    <label class="block text-[10px] uppercase tracking-widest text-gray-500 ml-4">New Password</label>
    <div class="relative">
        <input type="password" name="new_password" id="chg-new-password" required
            class="w-full custom-input rounded-full px-6 py-4 pr-14 text-white text-sm">
        <button type="button" onclick="togglePassword('chg-new-password', this)"
            class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[#D4AF37] transition">
            <i class="fa-regular fa-eye text-sm"></i>
        </button>
    </div>
</div>

<div class="space-y-2">
    <label class="block text-[10px] uppercase tracking-widest text-gray-500 ml-4">Confirm New Password</label>
    <div class="relative">
        <input type="password" name="confirm_password" id="chg-confirm-password" required
            class="w-full custom-input rounded-full px-6 py-4 pr-14 text-white text-sm">
        <button type="button" onclick="togglePassword('chg-confirm-password', this)"
            class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[#D4AF37] transition">
            <i class="fa-regular fa-eye text-sm"></i>
        </button>
    </div>
</div>

            {% if messages %}
                {% for message in messages %}
                    <p class="text-red-500 text-[10px] uppercase text-center font-bold tracking-widest">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <button type="submit" 
                class="w-full bg-[#D4AF37] hover:bg-white text-black py-5 rounded-full font-bold uppercase text-[11px] tracking-widest transition-all mt-4">
                Update Security
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="{% url 'profile' %}" class="text-gray-600 hover:text-[#D4AF37] text-[10px] uppercase tracking-widest transition-colors">
                ← Back to Profile
            </a>
        </div>
    </div>
    <script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
</body>
</html>
