{% extends 'base.html' %}

{% block title %}Decora | Reset Password{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-80px)] p-4">
    <div class="w-full max-w-[420px] bg-[#1a1a1a] border border-white/5 p-10 rounded-2xl shadow-2xl relative z-10">
        
        <div class="text-center mb-10">
            <h1 class="premium-font text-3xl text-[#D4AF37] mb-2">Forgot Password?</h1>
            <p class="text-gray-500 text-[10px] uppercase tracking-[0.2em]">Enter your email to receive a reset code</p>
        </div>

        <form action="{% url 'forgot_password' %}" method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Email Address</label>
                <input type="email" name="email" required
                    class="w-full bg-[#252525] border border-white/10 rounded-lg px-4 py-3 text-white outline-none transition-all focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37]/30">
            </div>

            <button type="submit" 
                class="w-full bg-gradient-to-r from-[#D4AF37] via-[#F1D27B] to-[#B8860B] text-black font-bold py-4 rounded-lg mt-4 hover:opacity-90 transition-opacity uppercase text-xs tracking-[0.2em] shadow-lg shadow-[#D4AF37]/10">
                Send Reset Code
            </button>
        </form>

        <div class="text-center mt-10">
            <a href="{% url 'user_login' %}" class="text-[10px] uppercase tracking-[0.2em] text-gray-500 hover:text-[#D4AF37] transition-colors flex items-center justify-center gap-2">
                <span>←</span> Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
